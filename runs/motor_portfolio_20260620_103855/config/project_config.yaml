data:
  path: data/Dataset of motor insurance portfolio.csv
  sep: ;
  target_col: total_premium
  exposure_col: total_exposure
  objective: gamma
  filter_zeros: true
llm:
  model: claude-sonnet-4-6
  temperature: 0.2
validation:
  objective: gamma
  n_rounds: 300
  early_stopping_rounds: 50
  min_deviance_improvement_pct: 0.1
  min_exposure_per_cluster: 500
gbm:
  n_rounds: 300
  early_stopping_rounds: 50
  val_fraction: 0.2
  num_leaves: 63
  learning_rate: 0.05
  feature_fraction: 0.8
  bagging_fraction: 0.8
  model_path: gbm_model.txt
  top_n_features: 15
  h_stat_n_sample: 500
  h_stat_grid_size: 20
features:
  numeric:
  - name: vehicle_age
    description: Age of the insured vehicle in years; older vehicles typically have
      lower market values but higher mechanical failure risk and different repair
      cost profiles, influencing both own-damage and total premium levels.
    data_quality_note: Max of 68 years is plausible for classic/vintage vehicles but
      worth validating against vehicle_value to ensure consistency.
    approved: true
  - name: age_driving_licence
    description: Number of years the driver has held a licence; proxy for driving
      experience, inversely correlated with risk particularly for younger cohorts
      where experience accumulation is most impactful.
    data_quality_note: Min of 0 may indicate newly licensed drivers; check for logical
      consistency with driver_age (licence age should not exceed driver_age minus
      approximately 16).
    approved: true
  - name: vehicle_value
    description: Market or insured value of the vehicle in currency units; key driver
      of own-damage premium components including comprehensive, theft, and fire coverages,
      and a primary determinant of total premium level.
    data_quality_note: 0.14% nulls require imputation; max of ~374k suggests high-value
      outliers — consider log-transform or capping for model stability.
    approved: true
  - name: power_to_weight_ratio
    description: Engine power relative to vehicle weight; indicator of vehicle performance
      characteristics and associated driving risk, with higher ratios typically correlating
      with more aggressive driving behaviour and elevated accident frequency.
    data_quality_note: Min of 0 may indicate data entry errors or electric vehicles
      with missing engine data — investigate zero values before modelling.
    approved: true
  - name: seats
    description: Number of seats in the vehicle; proxy for vehicle category (passenger
      car vs. minibus/MPV) and occupant exposure, with larger vehicles potentially
      exhibiting different risk profiles and premium structures.
    approved: true
  - name: liability_exposure
    description: Fractional exposure period for liability coverage; captures partial-year
      policies and is a key offset/weight variable for liability sub-models and total
      premium scaling.
    data_quality_note: Min of 0.0027 is very small — verify these are not data errors;
      may represent very short-term policies or mid-term cancellations.
    approved: true
  - name: driver_age
    description: Age of the primary driver in years; a well-established risk factor
      in motor insurance with non-linear effects — young drivers (<25) and elderly
      drivers (>70) typically exhibit elevated risk profiles, producing a U-shaped
      relationship with premium.
    data_quality_note: Range [18, 90] is consistent with a licensed driver population;
      no nulls. Consider a non-linear transformation (e.g. spline or banded grouping)
      to capture the U-shaped risk curve.
    approved: true
    comment_history:
    - author: agent
      text: driver_age remains in the included numeric list. The previous actuary
        note requested confirmation of inclusion — no exclusion action has been taken
        via the checkbox, so this variable is treated as confirmed included. If exclusion
        was intended, please uncheck this variable to move it to the excluded list.
      ts: '2026-08-30T06:51:44.081753+00:00'
      sent: true
    - author: actuary
      text: test
      ts: '2026-08-30T06:52:46.435641+00:00'
      sent: true
    - author: agent
      text: Actuary remark noted as 'test' — no substantive instruction detected.
        Variable remains confirmed included. No action taken beyond recording this
        note.
      ts: '2026-08-30T06:54:44.735004+00:00'
      sent: true
    - author: agent
      text: Actuary remark noted as 'test' — no substantive instruction detected.
        Variable remains confirmed included. No action taken beyond recording this
        note.
      ts: '2026-08-30T07:08:33.543890+00:00'
      sent: false
  categorical:
  - name: policy_type
    description: Type of motor insurance policy (e.g., comprehensive, third-party);
      directly determines which coverages are included and is the primary driver of
      premium level.
    ordinal: true
    order:
    - TP
    - TPG
    - CC
    - COMP_N
    - COMP_E
    n_clusters: 3
    data_quality_note: Only 5 categories with clear coverage hierarchy; COMP_E and
      COMP_N may need actuarial validation of risk ordering relative to CC.
    approved: true
    grouping:
      comprehensive_standard:
      - CC
      - COMP_E
      comprehensive_restricted:
      - COMP_N
      - TPG
      third_party_only:
      - TP
  - name: business_type
    description: Indicates whether the policy is new business (NB) or a renewal/portfolio
      transfer (P); renewals may exhibit different risk profiles due to selection
      effects and customer tenure.
    ordinal: false
    n_clusters: 2
    approved: true
    grouping:
      new_business:
      - NB
      renewal_portfolio:
      - P
  - name: payment_frequency
    description: Frequency of premium payment (Annual, Semi-annual, Quarterly); may
      correlate with customer segment and lapse risk, and can affect earned premium
      calculations.
    ordinal: false
    n_clusters: 2
    approved: true
    grouping:
      annual_payment:
      - A
      sub_annual_payment:
      - Q
      - S
  - name: bonus_score
    description: Bonus-malus or no-claims discount score (Good, Neutral, Bad); reflects
      historical claims experience and is a strong predictor of future risk.
    ordinal: true
    order:
    - G
    - N
    - B
    n_clusters: 3
    data_quality_note: Highly skewed toward G (341k vs 7.8k N and 4.7k B); Bad and
      Neutral categories have limited volume — monitor credibility.
    approved: true
    grouping:
      good_risk:
      - G
      neutral_risk:
      - N
      bad_risk:
      - B
  - name: fuel_type
    description: Type of fuel used by the vehicle (Diesel or Gasoline); associated
      with vehicle usage patterns, mileage, and repair cost differences.
    ordinal: false
    n_clusters: 2
    data_quality_note: 0.36% nulls — impute with mode or a separate 'Unknown' category;
      relatively minor missingness.
    approved: true
    grouping:
      diesel_fuel:
      - D
      gasoline_fuel:
      - G
  - name: vehicle_brand
    description: Manufacturer brand of the insured vehicle; captures brand-level differences
      in repair costs, parts availability, theft attractiveness, and driver demographics.
    ordinal: false
    n_clusters: 10
    data_quality_note: 68 unique brands with long tail of low-volume brands; grouping
      recommended to avoid overfitting on sparse brands.
    approved: true
    comment_history:
    - author: agent
      text: FIAT has been reassigned from mainstream_asian_mid_volume to mainstream_european_mid_volume,
        which is the appropriate group for a mass-market European brand with moderate
        volume. The previous label 'small_mainstream_and_eastern_european' referenced
        in the actuary remark does not exist as a group in the current grouping structure;
        the closest actuarially appropriate group is mainstream_european_mid_volume
        alongside SKODA, CHEVROLET, SUZUKI, MAZDA, and MITSUBISHI. Please confirm
        this placement is correct, or advise if a separate group or different assignment
        is preferred.
      ts: '2026-08-30T06:51:44.081834+00:00'
      sent: true
    - author: agent
      text: The actuary's remark requests confirmation that FIAT is correctly placed
        in the 'mainstream_mid_volume_european_and_american' group (previously labelled
        'mainstream_european_mid_volume' in the remark). FIAT has been retained in
        the 'small_mainstream_and_eastern_european' group alongside DACIA and DAEWOO,
        which is actuarially defensible given FIAT's positioning as a small-car mass-market
        European brand with a distinct repair cost and risk profile from mid-volume
        brands such as SKODA or CHEVROLET. If the actuary prefers FIAT to be moved
        to 'mainstream_mid_volume_european_and_american', please confirm and this
        reassignment will be applied in the next iteration.
      ts: '2026-08-30T06:54:44.735004+00:00'
      sent: true
    - author: agent
      text: The actuary queried whether FIAT is correctly placed. FIAT has been retained
        in the 'small_mainstream_and_eastern_european' group alongside DACIA and DAEWOO,
        which is actuarially defensible given FIAT's positioning as a small-car mass-market
        European brand with a distinct repair cost and risk profile from mid-volume
        brands such as SKODA or CHEVROLET. If the actuary prefers FIAT to be moved
        to a 'mainstream_mid_volume_european' group, please confirm and this reassignment
        will be applied in the next iteration.
      ts: '2026-08-30T07:08:33.543890+00:00'
      sent: false
    grouping:
      mass_market_french:
      - RENAULT
      - PEUGEOT
      - CITROEN
      mass_market_german_spanish:
      - VOLKSWAGEN
      - OPEL
      - SEAT
      mass_market_ford:
      - FORD
      premium_german:
      - AUDI
      - BMW
      - MERCEDES
      mainstream_asian_high_volume:
      - TOYOTA
      - NISSAN
      - HYUNDAI
      mainstream_asian_mid_volume:
      - KIA
      - HONDA
      mainstream_mid_volume_european_and_american:
      - FIAT
      - SKODA
      - CHEVROLET
      - SUZUKI
      - MAZDA
      - MITSUBISHI
      small_volume_budget_eastern_european:
      - DACIA
      - DAEWOO
      premium_niche_and_suv:
      - LAND ROVER
      - VOLVO
      - MINI
      - ALFA ROMEO
      low_volume_american_and_legacy:
      - CHRYSLER
      - JEEP
      - SSANGYONG
      - LEXUS
      - SAAB
      - ROVER
  - name: municipality_type
    description: Classification of the municipality where the vehicle is registered
      (e.g., Intermediate, Capital, Island); captures urban/rural density and infrastructure
      risk differences.
    ordinal: false
    n_clusters: 3
    approved: true
    grouping:
      urban_core:
      - C
      intermediate_mixed:
      - I
      rural_isolated:
      - IS
  - name: circulation_area
    description: Indicates whether the vehicle primarily circulates in Urban or Rural
      areas; urban areas typically exhibit higher frequency of minor accidents and
      theft.
    ordinal: false
    n_clusters: 2
    approved: true
    grouping:
      rural_area:
      - R
      urban_area:
      - U
