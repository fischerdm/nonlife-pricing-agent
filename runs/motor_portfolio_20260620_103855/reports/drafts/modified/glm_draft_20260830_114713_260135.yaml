  comment_history: []
- name: bonus_score:driver_age
  term_type: interaction
  h_statistic: 0.190054
  rationale: Young drivers with poor NCD represent a compounding high-risk segment,
    while older experienced drivers with good NCD are the lowest risk. The interaction
