terms:
- name: vehicle_age
  term_type: main
  h_statistic: null
  rationale: Older vehicles typically have higher mechanical failure risk but lower
    market value, creating a non-linear premium relationship. Vehicle age is a standard
    rating factor in motor pricing, capturing depreciation effects on repair costs
    and reliability.
  approved: null
  actuary_note: null
  comment_history: []
- name: age_driving_licence
  term_type: main
  h_statistic: null
  rationale: Years of driving experience is a well-established proxy for driver skill
    and risk awareness. Newer licence holders exhibit higher claim frequencies and
    severities. This factor is widely accepted by regulators as actuarially justified.
  approved: null
  actuary_note: null
  comment_history: []
- name: vehicle_value
  term_type: main
  h_statistic: null
  rationale: Vehicle value directly drives repair and replacement costs, making it
    a primary rating factor for own-damage and comprehensive covers. Higher-value
    vehicles attract higher premiums due to greater potential loss severity.
  approved: null
  actuary_note: null
  comment_history: []
- name: power_to_weight_ratio
  term_type: main
  h_statistic: null
  rationale: Power-to-weight ratio is a strong proxy for vehicle performance and associated
    accident risk. High-performance vehicles are associated with higher speeds and
    more severe accidents, justifying a positive premium loading.
  approved: null
  actuary_note: null
  comment_history: []
- name: seats
  term_type: main
  h_statistic: null
  rationale: Number of seats is a proxy for vehicle class (e.g., minibus vs. saloon)
    and potential passenger liability exposure. Larger vehicles may carry more occupants,
    increasing bodily injury liability risk.
  approved: null
  actuary_note: null
  comment_history: []
- name: liability_exposure
  term_type: main
  h_statistic: null
  rationale: Liability exposure level directly determines the insured limit for third-party
    claims. Higher liability limits increase expected loss costs and are a fundamental
    pricing input for motor liability covers.
  approved: null
  actuary_note: null
  comment_history: []
- name: driver_age
  term_type: main
  h_statistic: null
  rationale: Driver age is one of the most statistically significant predictors of
    motor claim frequency and severity. Young drivers (under 25) and elderly drivers
    (over 70) exhibit elevated risk profiles, consistent with extensive industry evidence.
  approved: null
  actuary_note: null
  comment_history: []
- name: policy_type
  term_type: main
  h_statistic: null
  rationale: Policy type (e.g., third-party only, third-party fire and theft, comprehensive)
    fundamentally determines the scope of cover and therefore the expected loss cost.
    It is a primary structural rating factor.
  approved: null
  actuary_note: null
  comment_history: []
- name: business_type
  term_type: main
  h_statistic: null
  rationale: Business type (e.g., private, commercial, fleet) captures usage patterns
    and risk profiles that differ materially. Commercial use vehicles typically have
    higher mileage and exposure, justifying differentiated pricing.
  approved: null
  actuary_note: null
  comment_history: []
- name: payment_frequency
  term_type: main
  h_statistic: null
  rationale: Payment frequency (annual vs. monthly) is associated with policyholder
    financial stability and persistency risk. Monthly payers may exhibit different
    risk profiles and lapse behaviour, and instalment loadings are commercially standard.
  approved: null
  actuary_note: null
  comment_history: []
- name: bonus_score
  term_type: main
  h_statistic: null
  rationale: Bonus-malus score (no-claims discount) is a direct measure of individual
    claims history and is one of the strongest predictors of future claim frequency.
    It is universally accepted as a core rating factor.
  approved: null
  actuary_note: null
  comment_history: []
- name: fuel_type
  term_type: main
  h_statistic: null
  rationale: Fuel type (petrol, diesel, electric, hybrid) is associated with vehicle
    performance characteristics, repair cost profiles, and usage patterns. Electric
    vehicles, for example, have different repair cost structures and risk profiles.
  approved: null
  actuary_note: null
  comment_history: []
- name: vehicle_brand
  term_type: main
  h_statistic: null
  rationale: Vehicle brand is a proxy for build quality, safety features, parts availability,
    and repair costs. Industry data consistently shows material differences in claim
    costs across manufacturers.
  approved: null
  actuary_note: null
  comment_history: []
- name: municipality_type
  term_type: main
  h_statistic: null
  rationale: Municipality type (urban, suburban, rural) captures traffic density,
    theft risk, and accident frequency. Urban areas typically exhibit higher claim
    frequencies, making this a standard geographic rating factor.
  approved: null
  actuary_note: null
  comment_history: []
- name: circulation_area
  term_type: main
  h_statistic: null
  rationale: Circulation area captures the broader geographic risk zone, reflecting
    regional differences in road infrastructure, weather, traffic patterns, and local
    claims experience. It complements municipality type at a higher geographic level.
  approved: null
  actuary_note: null
  comment_history: []
- name: liability_exposure:business_type
  term_type: interaction
  h_statistic: 0.469581
  rationale: The highest-ranked interaction. Commercial business types often select
    higher liability limits, and the risk associated with a given liability level
    differs materially between private and commercial use. The interaction captures
    that the premium uplift for higher limits is not uniform across business types.
  approved: null
  actuary_note: 'Strong actuarial justification: commercial operators face structurally
    different third-party liability risk profiles than private users. The H-statistic
    of 0.47 is very high and the interaction is economically intuitive. Recommended
    for inclusion.'
  comment_history: []
- name: fuel_type:seats
  term_type: interaction
  h_statistic: 0.437644
  rationale: Second-highest interaction. Larger vehicles (more seats) combined with
    specific fuel types (e.g., diesel minibuses vs. electric city cars) represent
    distinct risk segments with different repair costs, usage patterns, and accident
    profiles. The combination is not well captured by main effects alone.
  approved: null
  actuary_note: 'Actuarially plausible: the vehicle class implied by seats combined
    with fuel type defines distinct market segments (e.g., large diesel vans vs. small
    electric vehicles). High H-statistic supports inclusion. Recommend validating
    with claims data segmented by fuel_type x seats.'
  comment_history: []
- name: vehicle_brand:fuel_type
  term_type: interaction
  h_statistic: 0.300894
  rationale: Certain brands specialise in specific fuel technologies (e.g., premium
    EV brands, diesel-heavy commercial brands). Repair costs and parts availability
    differ by brand-fuel combination in ways not captured by either main effect alone.
  approved: null
  actuary_note: 'Actuarially justified: brand-specific fuel technology differences
    create distinct repair cost profiles. However, this interaction may produce many
    cells with sparse data if brand has many levels — recommend grouping brands before
    fitting and monitoring credibility.'
  comment_history: []
- name: power_to_weight_ratio:seats
  term_type: interaction
  h_statistic: 0.269802
  rationale: A high power-to-weight ratio in a large multi-seat vehicle (e.g., a powerful
    minibus) represents a different risk than the same ratio in a small sports car.
    The interaction captures how performance risk scales differently with vehicle
    size.
  approved: null
  actuary_note: 'Actuarially reasonable: the risk implications of high power-to-weight
    differ by vehicle class. Recommend validating that interaction coefficients are
    monotone and interpretable before regulatory submission.'
  comment_history: []
- name: bonus_score:business_type
  term_type: interaction
  h_statistic: 0.250079
  rationale: The predictive power of bonus-malus score may differ between private
    and commercial policyholders. Commercial fleets may have pooled NCD histories
    that are less individually predictive, while private NCD is a strong individual
    signal.
  approved: null
  actuary_note: 'Actuarially justified: NCD credibility differs by business type.
    This interaction is defensible to regulators as it reflects genuine differences
    in how claims history translates to future risk across segments.'
  comment_history: []
- name: bonus_score:liability_exposure
  term_type: interaction
  h_statistic: 0.247905
  rationale: Policyholders with poor claims history (low bonus score) who also select
    high liability limits may represent adverse selection — higher-risk drivers seeking
    greater protection. This interaction captures the compounding effect of these
    two risk signals.
  approved: null
  actuary_note: 'Actuarially sound: adverse selection argument is well-established.
    The interaction between claims history and coverage level is defensible. Ensure
    the interaction does not create perverse pricing incentives (e.g., penalising
    good drivers for choosing higher limits).'
  comment_history: []
- name: payment_frequency:policy_type
  term_type: interaction
  h_statistic: 0.244869
  rationale: 'The financial behaviour implied by payment frequency may interact with
    policy type: monthly payers of comprehensive policies may represent a different
    risk segment than monthly payers of third-party only policies, reflecting different
    financial profiles and risk attitudes.'
  approved: null
  actuary_note: Plausible but partially commercial in nature. The interaction may
    partly reflect affordability segmentation. Ensure this does not inadvertently
    proxy for protected characteristics. Recommend regulatory review before deployment.
  comment_history: []
- name: bonus_score:municipality_type
  term_type: interaction
  h_statistic: 0.229431
  rationale: 'The predictive value of claims history may vary by geography: in high-density
    urban areas, even good drivers face elevated exposure, potentially dampening the
    NCD signal. In rural areas, NCD may be a stronger differentiator.'
  approved: null
  actuary_note: 'Actuarially plausible: geographic risk modifies the interpretation
    of individual claims history. This interaction is defensible as it reflects genuine
    risk dynamics rather than arbitrary segmentation.'
  comment_history: []
- name: seats:municipality_type
  term_type: interaction
  h_statistic: 0.211379
  rationale: Large multi-seat vehicles operating in urban environments face different
    risk profiles (e.g., higher pedestrian interaction risk, parking damage) compared
    to the same vehicles in rural areas. The interaction captures this geographic-vehicle
    class dynamic.
  approved: null
  actuary_note: Actuarially reasonable. Recommend checking for data sparsity in rural
    large-vehicle cells before inclusion.
  comment_history: []
- name: power_to_weight_ratio:fuel_type
  term_type: interaction
  h_statistic: 0.210049
  rationale: Electric vehicles with high power-to-weight ratios have different acceleration
    and handling characteristics compared to high-performance petrol vehicles. The
    risk implications of performance differ by fuel technology, particularly for newer
    EV powertrains.
  approved: null
  actuary_note: Actuarially justified given the emergence of high-performance EVs.
    Recommend monitoring as EV claims data matures to ensure the interaction remains
    stable.
  comment_history: []
- name: vehicle_value:bonus_score
  term_type: interaction
  h_statistic: 0.206023
  rationale: 'High-value vehicles owned by drivers with poor claims history represent
    a compounding risk: both severity (high repair costs) and frequency (poor driver
    history) are elevated. The interaction captures this multiplicative risk effect.'
  approved: null
  actuary_note: 'Strong actuarial rationale: severity and frequency risk signals compound.
    This interaction is well-established in motor pricing literature and should be
    defensible to regulators.'
  comment_history: []
- name: vehicle_value:policy_type
  term_type: interaction
  h_statistic: 0.205569
  rationale: 'The relationship between vehicle value and premium is fundamentally
    different across policy types: for comprehensive cover, vehicle value directly
    drives own-damage costs, while for third-party only, the relationship is weaker.
    This structural difference justifies the interaction.'
  approved: null
  actuary_note: 'Highly defensible: the actuarial mechanism is clear and well-understood.
    This interaction is standard in motor pricing GLMs and should present no regulatory
    concerns.'
  comment_history: []
- name: power_to_weight_ratio:vehicle_brand
  term_type: interaction
  h_statistic: 0.197805
  rationale: 'The risk associated with high power-to-weight ratio varies by brand:
    a high-performance sports brand with high power-to-weight is a different risk
