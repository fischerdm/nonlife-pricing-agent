numeric:
- name: age_driving_licence
  description: Number of years the driver has held a licence; proxy for driving experience,
    inversely correlated with risk for younger cohorts.
  data_quality_note: Min of 0 may indicate newly licensed drivers; check for logical
    consistency with driver_age (licence age should not exceed driver_age minus ~16).
  approved: true
  actuary_note: null
- name: vehicle_value
  description: Market or insured value of the vehicle in currency units; key driver
    of own-damage premium components and total premium level.
  data_quality_note: 0.14% nulls require imputation; max of ~374k suggests high-value
    outliers — consider log-transform or capping for model stability.
  approved: true
  actuary_note: null
- name: power_to_weight_ratio
  description: Engine power relative to vehicle weight; indicator of vehicle performance
    and associated driving risk.
  data_quality_note: Min of 0 may indicate data entry errors or electric vehicles
    with missing engine data — investigate zero values.
  approved: true
  actuary_note: null
- name: seats
  description: Number of seats in the vehicle; proxy for vehicle category (passenger
    car vs. minibus) and occupant exposure.
  data_quality_note: null
  approved: true
  actuary_note: null
- name: liability_exposure
  description: Fractional exposure period for liability coverage; captures partial-year
    policies and is a key offset/weight variable for liability sub-models.
  data_quality_note: Min of 0.0027 is very small — verify these are not data errors;
    may represent very short-term policies.
  approved: true
  actuary_note: null
- name: driver_age
  description: Age of the primary driver in years; a well-established risk factor
    in motor insurance with non-linear effects — young drivers (<25) and elderly drivers
    (>70) typically exhibit elevated risk profiles.
  data_quality_note: Range [18, 90] is consistent with a licensed driver population;
    no nulls. Consider a non-linear transformation (e.g. spline or banded grouping)
    to capture the U-shaped risk curve.
  approved: true
  actuary_note: Confirmed included as per actuary decision. No exclusion action was
    taken via the checkbox in the previous round, so this variable is treated as approved
    for inclusion.
categorical:
- name: policy_type
  description: Type of motor insurance policy (e.g., comprehensive, third-party);
    directly determines which coverages are included and is the primary driver of
    premium level.
  ordinal: true
  order:
  - TP
  - TPG
  - CC
  - COMP_N
  - COMP_E
  n_clusters: 3
  data_quality_note: Only 5 categories with clear coverage hierarchy; COMP_E and COMP_N
    may need actuarial validation of risk ordering relative to CC.
  approved: true
  actuary_note: null
  grouping:
    comprehensive_standard:
    - CC
    - COMP_E
    comprehensive_restricted:
    - COMP_N
    - TPG
    third_party_only:
    - TP
- name: business_type
  description: Indicates whether the policy is new business (NB) or a renewal/portfolio
    transfer (P); renewals may exhibit different risk profiles due to selection effects.
  ordinal: false
  order: null
  n_clusters: 2
  data_quality_note: null
  approved: true
  actuary_note: null
  grouping:
    new_business:
    - NB
    renewal_portfolio:
    - P
- name: payment_frequency
  description: Frequency of premium payment (Annual, Semi-annual, Quarterly); may
    correlate with customer segment and lapse risk, and can affect earned premium
    calculations.
  ordinal: false
  order: null
  n_clusters: 2
  data_quality_note: null
  approved: true
  actuary_note: null
  grouping:
    annual_payment:
    - A
    sub_annual_payment:
    - Q
    - S
- name: bonus_score
  description: Bonus-malus or no-claims discount score (Good, Neutral, Bad); reflects
    historical claims experience and is a strong predictor of future risk.
  ordinal: true
  order:
  - G
  - N
  - B
  n_clusters: 3
  data_quality_note: Highly skewed toward G (341k vs 7.8k N and 4.7k B); Bad and Neutral
    categories have limited volume — monitor credibility.
  approved: true
  actuary_note: null
  grouping:
    good_risk:
    - G
    neutral_risk:
    - N
    bad_risk:
    - B
- name: fuel_type
  description: Type of fuel used by the vehicle (Diesel or Gasoline); associated with
    vehicle usage patterns, mileage, and repair cost differences.
  ordinal: false
  order: null
  n_clusters: 2
  data_quality_note: 0.36% nulls — impute with mode or a separate 'Unknown' category;
    relatively minor missingness.
  approved: true
  actuary_note: null
  grouping:
    diesel_fuel:
    - D
    gasoline_fuel:
    - G
- name: vehicle_brand
  description: Manufacturer brand of the insured vehicle; captures brand-level differences
    in repair costs, parts availability, theft attractiveness, and driver demographics.
  ordinal: false
  order: null
  n_clusters: 10
  data_quality_note: 68 unique brands with long tail of low-volume brands; grouping
    recommended to avoid overfitting on sparse brands.
  approved: true
  actuary_note: FIAT has been placed in the 'small_mainstream_and_eastern_european'
    group alongside DACIA and DAEWOO, reflecting its positioning as a mass-market
    European brand with a budget/entry-level profile. The actuary's remark noted that
    FIAT was previously reassigned to a 'mainstream_european_mid_volume' group, but
    that label does not exist in the current grouping structure. The closest existing
    group that reflects FIAT's market positioning — budget-oriented, high-volume,
    European — is 'small_mainstream_and_eastern_european'. If the actuary prefers
    FIAT to be grouped with SKODA, CHEVROLET, SUZUKI, MAZDA, and MITSUBISHI in a mid-volume
    mainstream group, please advise and a new group label can be created. Current
    placement is retained as 'small_mainstream_and_eastern_european' pending confirmation.
  grouping:
    mass_market_french:
    - RENAULT
    - PEUGEOT
    - CITROEN
    mass_market_german_spanish:
    - VOLKSWAGEN
    - OPEL
    - SEAT
    mass_market_ford:
    - FORD
    premium_german:
    - AUDI
    - BMW
    - MERCEDES
    mainstream_asian_high_volume:
    - TOYOTA
    - NISSAN
    - HYUNDAI
    mainstream_asian_mid_volume:
    - KIA
    - HONDA
    mainstream_european_mid_volume:
    - FIAT
    - SKODA
    - CHEVROLET
    - SUZUKI
    - MAZDA
    - MITSUBISHI
    small_volume_eastern_european_and_budget:
    - DACIA
    - DAEWOO
    premium_niche_and_suv:
    - LAND ROVER
    - VOLVO
    - MINI
    - ALFA ROMEO
    low_volume_american_and_legacy:
    - CHRYSLER
    - JEEP
    - SSANGYONG
    - LEXUS
    - SAAB
    - ROVER
- name: municipality_type
  description: Classification of the municipality where the vehicle is registered
    (e.g., Intermediate, Capital, Island); captures urban/rural density and infrastructure
    risk differences.
  ordinal: false
  order: null
  n_clusters: 3
  data_quality_note: null
  approved: true
  actuary_note: null
  grouping:
    urban_core:
    - C
    intermediate_mixed:
    - I
    rural_isolated:
    - IS
- name: circulation_area
  description: Indicates whether the vehicle primarily circulates in Urban or Rural
    areas; urban areas typically exhibit higher frequency of minor accidents and theft.
  ordinal: false
  order: null
  n_clusters: 2
  data_quality_note: null
  approved: true
  actuary_note: null
  grouping:
    rural_area:
    - R
    urban_area:
    - U
