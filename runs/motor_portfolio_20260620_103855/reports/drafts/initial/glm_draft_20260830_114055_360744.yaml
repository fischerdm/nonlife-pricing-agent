formula: log(total_premium / total_exposure) ~ vehicle_age + age_driving_licence +
  vehicle_value + power_to_weight_ratio + seats + liability_exposure + driver_age
  + policy_type + business_type + payment_frequency + bonus_score + fuel_type + vehicle_brand
  + municipality_type + circulation_area + liability_exposure:business_type + fuel_type:seats
  + vehicle_brand:fuel_type + power_to_weight_ratio:seats + bonus_score:business_type
  + bonus_score:liability_exposure + payment_frequency:policy_type + bonus_score:municipality_type
  + seats:municipality_type + bonus_score:payment_frequency + power_to_weight_ratio:fuel_type
  + vehicle_value:bonus_score + vehicle_value:policy_type + power_to_weight_ratio:vehicle_brand
  + bonus_score:policy_type + bonus_score:driver_age + bonus_score:age_driving_licence
  + policy_type:municipality_type + vehicle_brand:seats + power_to_weight_ratio:age_driving_licence
  + power_to_weight_ratio:policy_type + policy_type:circulation_area + liability_exposure:age_driving_licence
  + seats:circulation_area + vehicle_value:payment_frequency + vehicle_value:fuel_type
  + vehicle_value:power_to_weight_ratio + payment_frequency:driver_age + vehicle_age:policy_type
  + policy_type:seats + driver_age:seats + vehicle_age:business_type + seats:age_driving_licence
