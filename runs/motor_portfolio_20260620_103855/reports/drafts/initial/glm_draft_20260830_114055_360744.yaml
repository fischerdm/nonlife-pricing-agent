  comment_history: []
- name: power_to_weight_ratio:age_driving_licence
  term_type: interaction
  h_statistic: 0.14926
  rationale: Inexperienced drivers operating high-performance vehicles face disproportionately
    elevated accident risk; the interaction captures the compounded effect of performance
    and inexperience.
  approved: null
  actuary_note: H-statistic 0.15. Actuarially well-founded and regulatorily defensible.
