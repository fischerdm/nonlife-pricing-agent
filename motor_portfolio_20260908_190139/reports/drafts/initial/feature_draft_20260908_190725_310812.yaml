  data_quality_note: null
  approved: null
  actuary_note: null
  comment_history: []
- name: fire_premium
  description: Current booked fire premium component; reflects fire damage risk pricing.
  data_quality_note: null
  approved: null
  actuary_note: null
  comment_history: []
categorical:
- name: policy_type
  description: Type of motor insurance policy (e.g., comprehensive, third-party);
    directly determines which coverages are included and is a primary risk/premium
    driver.
  ordinal: true
  order:
  - TP
  - TPG
  - CC
  - COMP_N
  - COMP_E
  n_clusters: 3
  data_quality_note: Ordering is approximate from least to most comprehensive coverage;
    CC vs COMP_N/COMP_E ordering should be validated against actual coverage definitions.
  approved: null
  actuary_note: null
  comment_history: []
  grouping:
    comprehensive_standard:
    - CC
    - COMP_E
    comprehensive_restricted:
    - COMP_N
    - TPG
    third_party_only:
    - TP
- name: business_type
