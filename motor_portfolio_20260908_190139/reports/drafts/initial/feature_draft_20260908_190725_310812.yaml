excluded:
- policy_status
- total_claims
- liability_claims
- liability_property_claims
- liability_injury_claims
- property_claims
- theft_claims
- fire_claims
- glass_claims
- legal_protection_claims
- occupants_claims
- total_incurred
- liability_incurred
- liability_property_incurred
- liability_injury_incurred
- property_incurred
- theft_incurred
- fire_incurred
- glass_incurred
- legal_protection_incurred
- occupants_incurred
- liability_exposure
exclusion_rationale:
  policy_status: Active/cancelled status is an outcome of the policy lifecycle rather
    than a risk predictor; including it would introduce target leakage as cancelled
    policies may have different premium structures for non-risk reasons.
  total_claims: Realised claims count during the exposure period; using it as a feature
    would constitute target leakage since it is an outcome variable contemporaneous
    with the premium target.
  liability_claims: Realised liability claims count; target leakage — outcome variable
    that should not be used as a predictor of premium.
  liability_property_claims: Realised liability property damage claims count; target
    leakage.
  liability_injury_claims: Realised liability bodily injury claims count; target leakage.
  property_claims: Realised own-damage property claims count; target leakage.
  theft_claims: Realised theft claims count; target leakage.
  fire_claims: Realised fire claims count; target leakage.
  glass_claims: Realised glass claims count; target leakage.
  legal_protection_claims: Realised legal protection claims count; target leakage.
  occupants_claims: Realised occupants/personal accident claims count; target leakage.
  total_incurred: Total incurred claims cost during the exposure period; direct outcome
    variable — using it would constitute severe target leakage.
  liability_incurred: Incurred liability claims cost; target leakage.
  liability_property_incurred: Incurred liability property damage cost; target leakage.
  liability_injury_incurred: Incurred liability bodily injury cost; target leakage.
  property_incurred: Incurred own-damage property cost; target leakage.
  theft_incurred: Incurred theft claims cost; target leakage.
  fire_incurred: Incurred fire claims cost; target leakage.
  glass_incurred: Incurred glass claims cost; target leakage.
  legal_protection_incurred: Incurred legal protection claims cost; target leakage.
  occupants_incurred: Incurred occupants/personal accident claims cost; target leakage.
  liability_exposure: Exposure measure for the liability coverage sub-period; this
    is an exposure variable analogous to total_exposure and should be used in model
    offsets if needed, not as a feature, to avoid confounding the exposure structure.
excluded_description:
  policy_status: Binary indicator of whether the policy is currently active (A) or
    cancelled (C).
  total_claims: Total number of claims of all types reported during the policy exposure
    period.
  liability_claims: Number of third-party liability claims (all sub-types combined)
    during the exposure period.
  liability_property_claims: Number of third-party liability claims involving property
    damage during the exposure period.
  liability_injury_claims: Number of third-party liability claims involving bodily
    injury during the exposure period.
  property_claims: Number of own-damage property claims during the exposure period.
  theft_claims: Number of theft claims during the exposure period.
  fire_claims: Number of fire damage claims during the exposure period.
  glass_claims: Number of glass/windscreen claims during the exposure period.
  legal_protection_claims: Number of legal protection/expenses claims during the exposure
    period.
  occupants_claims: Number of occupants/personal accident claims during the exposure
    period.
  total_incurred: Total incurred claims cost across all coverage types during the
    exposure period.
  liability_incurred: Total incurred cost for third-party liability claims during
    the exposure period.
  liability_property_incurred: Incurred cost for third-party liability property damage
    claims during the exposure period.
  liability_injury_incurred: Incurred cost for third-party liability bodily injury
    claims during the exposure period.
  property_incurred: Incurred cost for own-damage property claims during the exposure
    period.
  theft_incurred: Incurred cost for theft claims during the exposure period.
  fire_incurred: Incurred cost for fire damage claims during the exposure period.
  glass_incurred: Incurred cost for glass/windscreen claims during the exposure period.
  legal_protection_incurred: Incurred cost for legal protection claims during the
    exposure period.
  occupants_incurred: Incurred cost for occupants/personal accident claims during
    the exposure period.
  liability_exposure: Fractional exposure measure (0 to 1) representing the proportion
    of the period for which liability coverage was active.
