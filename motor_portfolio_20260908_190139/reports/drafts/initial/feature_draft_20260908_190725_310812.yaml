numeric:
- name: driver_age
  description: Age of the primary driver in years; a fundamental risk factor capturing
    young/inexperienced and elderly driver risk profiles.
  data_quality_note: null
  approved: null
  actuary_note: null
  comment_history: []
- name: vehicle_age
  description: Age of the insured vehicle in years; older vehicles typically have
    lower values but higher mechanical failure risk and different repair cost profiles.
  data_quality_note: Max of 68 years is plausible for classic/vintage vehicles but
    worth validating against vehicle_value for consistency.
  approved: null
  actuary_note: null
  comment_history: []
- name: age_driving_licence
  description: Number of years the driver has held a licence; proxy for driving experience,
    correlated with but distinct from driver_age.
  data_quality_note: Min of 0 may indicate newly licensed drivers; values should be
    cross-checked against driver_age for logical consistency (licence age cannot exceed
    driver_age minus ~16).
  approved: null
  actuary_note: null
  comment_history: []
- name: vehicle_value
  description: Market or insured value of the vehicle in currency units; key driver
    of comprehensive/property damage premium and theft exposure.
  data_quality_note: 0.14% nulls require imputation; max of ~374k suggests high-value/exotic
    vehicles — consider capping or log-transforming to reduce leverage.
  approved: null
  actuary_note: null
  comment_history: []
- name: power_to_weight_ratio
  description: Engine power relative to vehicle weight; proxy for vehicle performance
    and associated accident severity/frequency risk.
  data_quality_note: Min of 0 may indicate missing or electric vehicles with no combustion
    engine — verify these records.
  approved: null
  actuary_note: null
  comment_history: []
- name: seats
  description: Number of seats in the vehicle; relates to occupant exposure and vehicle
    category (passenger car vs. minibus).
  data_quality_note: Low cardinality (8 unique values); could be treated as categorical
    but numeric encoding is appropriate for GBM.
  approved: null
  actuary_note: null
  comment_history: []
- name: liability_premium
  description: Current booked liability premium component; reflects existing pricing
    signal and risk segmentation already embedded in the tariff.
  data_quality_note: Min of 0 may indicate policies where liability cover is not applicable
    (e.g., TP-only variants) — verify against policy_type.
  approved: null
  actuary_note: null
  comment_history: []
- name: property_damage_premium
  description: Current booked own-damage/property premium component; captures existing
    pricing for physical damage coverage.
  data_quality_note: Min of 0 expected for policies without own-damage cover; high
    std relative to mean suggests skewed distribution.
  approved: null
  actuary_note: null
  comment_history: []
- name: theft_premium
  description: Current booked theft premium component; reflects theft risk pricing
    already embedded in the tariff.
  data_quality_note: Min of 0 expected for policies without theft cover.
  approved: null
  actuary_note: null
  comment_history: []
- name: glass_premium
  description: Current booked glass/windscreen premium component; reflects glass breakage
    risk pricing.
  data_quality_note: null
  approved: null
  actuary_note: null
  comment_history: []
- name: legal_protection_premium
  description: Current booked legal protection premium component; reflects legal expenses
