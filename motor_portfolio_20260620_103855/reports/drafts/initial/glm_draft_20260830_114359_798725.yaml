terms:
- name: vehicle_age
  term_type: main
  h_statistic: null
  rationale: Older vehicles typically have lower market values but may have higher
    maintenance-related claim costs and less advanced safety features. Vehicle age
    is a well-established rating factor in motor insurance, capturing depreciation
    effects on repair costs and total-loss settlements.
  approved: null
  actuary_note: null
  comment_history: []
- name: age_driving_licence
  term_type: main
  h_statistic: null
  rationale: Years of driving experience is a strong predictor of claim frequency
    and severity. Less experienced drivers (shorter licence tenure) are associated
    with higher accident rates. This is a standard actuarial rating variable distinct
    from driver age, capturing accumulated driving skill.
  approved: null
  actuary_note: null
  comment_history: []
- name: vehicle_value
  term_type: main
  h_statistic: null
  rationale: Vehicle value is a primary driver of claim severity, particularly for
    own-damage and theft covers. Higher-value vehicles attract larger repair and replacement
    costs. It is one of the most fundamental rating factors in motor pricing.
  approved: null
  actuary_note: null
  comment_history: []
- name: power_to_weight_ratio
  term_type: main
  h_statistic: null
  rationale: Power-to-weight ratio is a proxy for vehicle performance and driving
    risk. High-performance vehicles are associated with higher speeds, greater accident
    severity, and increased claim costs. This is an actuarially sound alternative
    to engine power alone.
  approved: null
  actuary_note: null
  comment_history: []
- name: seats
  term_type: main
  h_statistic: null
  rationale: Number of seats is a proxy for vehicle type (e.g., minibus vs. saloon)
    and usage pattern. Larger vehicles may carry more passengers, affecting liability
    exposure and repair costs. It also correlates with commercial vs. private use.
  approved: null
  actuary_note: null
  comment_history: []
- name: liability_exposure
  term_type: main
  h_statistic: null
  rationale: Liability exposure level directly determines the insured limit for third-party
    claims, which is a primary driver of expected loss cost. Higher liability limits
    increase the potential severity of claims and must be reflected in the premium.
  approved: null
  actuary_note: null
  comment_history: []
- name: driver_age
  term_type: main
  h_statistic: null
  rationale: Driver age is one of the most significant predictors of motor claim frequency.
    Young drivers (under 25) and, to a lesser extent, elderly drivers exhibit higher
    accident rates. This is universally accepted as an actuarially justified rating
    factor.
  approved: null
  actuary_note: null
  comment_history: []
- name: policy_type
  term_type: main
  h_statistic: null
  rationale: Policy type (e.g., third-party only, third-party fire and theft, comprehensive)
    defines the scope of cover and directly determines the expected loss cost. It
    is a fundamental structural rating factor.
  approved: null
  actuary_note: null
  comment_history: []
- name: business_type
  term_type: main
  h_statistic: null
  rationale: Business type (e.g., private, commercial, fleet) captures usage patterns
    and risk profiles that differ materially. Commercial vehicles typically have higher
    mileage and different risk exposures than private vehicles.
  approved: null
  actuary_note: null
  comment_history: []
- name: payment_frequency
  term_type: main
  h_statistic: null
  rationale: Payment frequency (annual vs. monthly) is associated with policyholder
    financial behaviour and may correlate with lapse risk and credit risk. It also
    has a direct financial cost impact through instalment charges and is a standard
    pricing component.
  approved: null
  actuary_note: null
  comment_history: []
- name: bonus_score
  term_type: main
  h_statistic: null
  rationale: Bonus-malus score (no-claims discount or similar) is one of the strongest
    predictors of future claim frequency, as it encodes the policyholder's historical
    claims experience. It is a cornerstone of motor pricing across most markets.
  approved: null
  actuary_note: null
  comment_history: []
- name: fuel_type
  term_type: main
  h_statistic: null
  rationale: Fuel type (petrol, diesel, electric, hybrid) is associated with vehicle
    performance characteristics, repair cost profiles, and usage patterns. Electric
    vehicles, for example, have different repair cost structures and risk profiles.
  approved: null
  actuary_note: null
  comment_history: []
- name: vehicle_brand
  term_type: main
  h_statistic: null
  rationale: Vehicle brand captures differences in repair costs, parts availability,
    theft attractiveness, and safety ratings across manufacturers. It is a well-established
    rating factor supported by claims data.
  approved: null
  actuary_note: null
  comment_history: []
- name: municipality_type
  term_type: main
  h_statistic: null
  rationale: Municipality type (urban, suburban, rural) is a geographic risk factor
    capturing traffic density, theft rates, and accident frequency. Urban areas typically
    exhibit higher claim frequencies. This is a standard territorial rating variable.
  approved: null
  actuary_note: null
  comment_history: []
- name: circulation_area
  term_type: main
  h_statistic: null
  rationale: Circulation area captures the broader geographic region of vehicle use,
    reflecting regional differences in road infrastructure, weather, traffic patterns,
    and local claims experience. It complements municipality type at a higher geographic
    level.
  approved: null
  actuary_note: null
  comment_history: []
- name: liability_exposure:business_type
  term_type: interaction
  h_statistic: 0.469581
  rationale: The interaction between liability exposure level and business type is
    actuarially well-justified. Commercial operators (e.g., taxis, delivery vehicles)
    face structurally different third-party liability risk profiles compared to private
    users at the same nominal liability limit. The marginal cost of higher liability
    limits differs materially by business type, making this interaction both credible
    and defensible.
  approved: null
  actuary_note: 'Highest H-statistic in the list (0.47). Strong actuarial rationale:
    commercial business types have fundamentally different liability risk distributions.
    This interaction is regulatorily defensible as it reflects genuine risk differentiation
    rather than a proxy for a protected characteristic.'
  comment_history: []
- name: fuel_type:seats
  term_type: interaction
  h_statistic: 0.437644
  rationale: The combination of fuel type and number of seats captures distinct vehicle
    segments (e.g., large diesel minibuses vs. small electric city cars) that have
    materially different risk profiles, repair costs, and usage patterns. This interaction
    reflects genuine vehicle segment differentiation.
  approved: null
  actuary_note: Second highest H-statistic (0.44). The interaction is plausible as
    fuel type and seat count together define vehicle segments with distinct risk characteristics.
    Regulatorily defensible as both variables are objective vehicle characteristics.
  comment_history: []
- name: vehicle_brand:fuel_type
  term_type: interaction
  h_statistic: 0.300894
  rationale: Different vehicle brands have varying levels of maturity in their electric
    and hybrid offerings, leading to different repair cost structures and parts availability
    by brand-fuel type combination. This interaction captures genuine differences
    in claims costs across vehicle technology segments.
  approved: null
  actuary_note: H-statistic of 0.30. Actuarially justified given that repair cost
    profiles for EVs vs. ICE vehicles differ significantly by brand (e.g., specialist
    vs. mainstream manufacturers). Care should be taken to ensure sufficient data
    volume per cell, particularly for newer EV brands.
  comment_history: []
- name: power_to_weight_ratio:seats
  term_type: interaction
  h_statistic: 0.269802
  rationale: Power-to-weight ratio interacts with vehicle size (seats) because a high
    power-to-weight ratio in a large multi-seat vehicle implies a different risk profile
    than in a small sports car. Large high-powered vehicles may pose greater severity
    risk in accidents.
  approved: null
  actuary_note: 'H-statistic of 0.27. Actuarially plausible: the risk implications
    of high power-to-weight differ by vehicle class. Regulatorily defensible as both
    are objective vehicle characteristics.'
  comment_history: []
- name: bonus_score:business_type
  term_type: interaction
  h_statistic: 0.250079
  rationale: The predictive power of bonus-malus score may differ between commercial
    and private policyholders. Commercial operators may have fleet-level bonus structures
    or different claims reporting behaviours, making the bonus score less or more
    predictive depending on business type.
  approved: null
  actuary_note: 'H-statistic of 0.25. Actuarially justified: bonus score calibration
    and its relationship to future claims differs between private and commercial segments.
    This is a credible interaction with regulatory defensibility.'
  comment_history: []
- name: bonus_score:liability_exposure
  term_type: interaction
  h_statistic: 0.247905
  rationale: Policyholders with poor claims history (low bonus score) who also carry
    high liability limits represent a compounded risk. The interaction captures the
    non-additive effect of high-risk drivers choosing or requiring higher liability
    cover.
  approved: null
  actuary_note: 'H-statistic of 0.25. Strong actuarial rationale: adverse selection
    may lead high-risk drivers to select higher liability limits, creating a super-additive
    risk effect. Regulatorily defensible.'
  comment_history: []
- name: payment_frequency:policy_type
  term_type: interaction
  h_statistic: 0.244869
  rationale: The financial behaviour signal embedded in payment frequency may differ
    by policy type. Comprehensive policyholders paying monthly may represent a different
    risk segment than third-party-only monthly payers, reflecting different financial
    profiles and risk attitudes.
  approved: null
  actuary_note: 'H-statistic of 0.24. Plausible interaction: the relationship between
    payment frequency and risk may be moderated by the level of cover chosen. Should
    be validated with claims data to ensure it is not purely a data artefact.'
  comment_history: []
- name: bonus_score:municipality_type
  term_type: interaction
  h_statistic: 0.229431
  rationale: The predictive value of bonus score may vary by geographic area. In urban
    areas with higher baseline claim frequencies, a poor bonus score may be more or
    less informative than in rural areas. This interaction captures geographic modulation
    of the bonus signal.
  approved: null
  actuary_note: 'H-statistic of 0.23. Actuarially plausible: claims frequency baselines
    differ by municipality type, which may affect how bonus score translates to future
    risk. Regulatorily defensible as both are objective risk factors.'
  comment_history: []
- name: bonus_score:payment_frequency
  term_type: interaction
  h_statistic: 0.211277
  rationale: Both bonus score and payment frequency are behavioural indicators. Their
    interaction may capture a segment of financially stressed, high-risk policyholders
    (poor bonus, monthly payment) that represents elevated risk beyond the additive
    effect of each factor.
  approved: null
  actuary_note: H-statistic of 0.21. The interaction has actuarial logic as both variables
    carry behavioural risk signals. However, care should be taken that this does not
    inadvertently proxy for socioeconomic status in a way that raises regulatory concerns.
    Validate that the interaction is driven by genuine risk differentiation.
  comment_history: []
- name: power_to_weight_ratio:fuel_type
  term_type: interaction
  h_statistic: 0.210049
  rationale: The risk implications of high power-to-weight ratio differ by fuel type.
