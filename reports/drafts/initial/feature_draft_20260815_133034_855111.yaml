exclusion_rationale:
  policy_status: Active/cancelled status is an outcome of the policy lifecycle rather
    than a risk predictor; including it would introduce target leakage and is not
    available at quote stage.
  liability_premium: Component of the target variable (total_premium); including it
    would cause direct target leakage.
  property_damage_premium: Component of the target variable (total_premium); including
    it would cause direct target leakage.
  theft_premium: Component of the target variable (total_premium); including it would
    cause direct target leakage.
  fire_premium: Component of the target variable (total_premium); including it would
    cause direct target leakage.
  glass_premium: Component of the target variable (total_premium); including it would
    cause direct target leakage.
  legal_protection_premium: Component of the target variable (total_premium); including
    it would cause direct target leakage.
  occupants_premium: Component of the target variable (total_premium); including it
    would cause direct target leakage.
  total_claims: Claims count observed during the policy period — post-exposure information
    causing target leakage; not available at pricing time.
  liability_claims: Post-exposure claims count for liability coverage; causes target
    leakage and is not available at quote stage.
  liability_property_claims: Post-exposure claims count for liability property damage;
    causes target leakage.
  liability_injury_claims: Post-exposure claims count for liability bodily injury;
    causes target leakage.
  property_claims: Post-exposure claims count for own property damage; causes target
    leakage.
  theft_claims: Post-exposure claims count for theft; causes target leakage.
  fire_claims: Post-exposure claims count for fire; causes target leakage.
  glass_claims: Post-exposure claims count for glass breakage; causes target leakage.
  legal_protection_claims: Post-exposure claims count for legal protection; causes
    target leakage.
  occupants_claims: Post-exposure claims count for occupants coverage; causes target
    leakage.
  total_incurred: Total claims incurred amount observed post-exposure; severe target
    leakage — directly correlated with premium adequacy.
  liability_incurred: Incurred losses for liability coverage observed post-exposure;
    causes target leakage.
  liability_property_incurred: Incurred losses for liability property damage observed
    post-exposure; causes target leakage.
  liability_injury_incurred: Incurred losses for liability bodily injury observed
    post-exposure; causes target leakage.
  property_incurred: Incurred losses for own property damage observed post-exposure;
    causes target leakage.
  theft_incurred: Incurred losses for theft observed post-exposure; causes target
    leakage.
  fire_incurred: Incurred losses for fire observed post-exposure; causes target leakage.
  glass_incurred: Incurred losses for glass breakage observed post-exposure; causes
    target leakage.
  legal_protection_incurred: Incurred losses for legal protection observed post-exposure;
    causes target leakage.
  occupants_incurred: Incurred losses for occupants coverage observed post-exposure;
    causes target leakage.
excluded_description:
  policy_status: Binary indicator of whether the policy is currently active (A) or
    cancelled (C).
  liability_premium: Premium charged for third-party liability coverage, a sub-component
    of total_premium.
  property_damage_premium: Premium charged for own property damage coverage, a sub-component
    of total_premium.
  theft_premium: Premium charged for vehicle theft coverage, a sub-component of total_premium.
  fire_premium: Premium charged for fire damage coverage, a sub-component of total_premium.
  glass_premium: Premium charged for glass breakage coverage, a sub-component of total_premium.
  legal_protection_premium: Premium charged for legal protection coverage, a sub-component
    of total_premium.
  occupants_premium: Premium charged for vehicle occupants personal accident coverage,
    a sub-component of total_premium.
  total_claims: Total number of claims of all types reported during the policy period.
  liability_claims: Number of third-party liability claims reported during the policy
    period.
  liability_property_claims: Number of third-party liability property damage claims
    reported during the policy period.
  liability_injury_claims: Number of third-party liability bodily injury claims reported
    during the policy period.
  property_claims: Number of own property damage claims reported during the policy
    period.
  theft_claims: Number of vehicle theft claims reported during the policy period.
  fire_claims: Number of fire damage claims reported during the policy period.
  glass_claims: Number of glass breakage claims reported during the policy period.
  legal_protection_claims: Number of legal protection claims reported during the policy
    period.
  occupants_claims: Number of occupants personal accident claims reported during the
    policy period.
  total_incurred: Total incurred claims cost across all coverage types for the policy
    period.
  liability_incurred: Total incurred claims cost for third-party liability coverage.
  liability_property_incurred: Total incurred claims cost for third-party liability
    property damage.
  liability_injury_incurred: Total incurred claims cost for third-party liability
    bodily injury.
  property_incurred: Total incurred claims cost for own property damage coverage.
  theft_incurred: Total incurred claims cost for vehicle theft coverage.
  fire_incurred: Total incurred claims cost for fire damage coverage.
  glass_incurred: Total incurred claims cost for glass breakage coverage.
  legal_protection_incurred: Total incurred claims cost for legal protection coverage.
  occupants_incurred: Total incurred claims cost for occupants personal accident coverage.
