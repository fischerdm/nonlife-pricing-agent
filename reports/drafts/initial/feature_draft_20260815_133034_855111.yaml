numeric:
- name: driver_age
  description: Age of the primary driver in years; a core risk factor capturing young/inexperienced
    and elderly driver risk profiles.
  data_quality_note: null
  approved: null
  actuary_note: null
- name: vehicle_age
  description: Age of the insured vehicle in years; older vehicles typically have
    lower values but higher mechanical failure risk and different repair cost profiles.
  data_quality_note: Max of 68 years is plausible for classic/vintage vehicles but
    worth validating against vehicle_value.
  approved: null
  actuary_note: null
- name: age_driving_licence
  description: Number of years the driver has held a licence; proxy for driving experience,
    inversely correlated with risk for younger drivers.
  data_quality_note: Min of 0 may indicate newly licensed drivers or a data entry
    issue; values should be cross-checked against driver_age.
  approved: null
  actuary_note: null
- name: vehicle_value
  description: Market or insured value of the vehicle; key driver of property damage
    and theft premium adequacy.
  data_quality_note: 0.14% nulls; max of ~374k suggests high-value/luxury vehicles
    — outlier treatment recommended. Impute nulls using vehicle brand/age.
  approved: null
  actuary_note: null
- name: power_to_weight_ratio
  description: Ratio of engine power to vehicle weight; higher values indicate sportier,
    higher-risk vehicles.
  data_quality_note: Min of 0 may indicate missing or electric vehicles with no combustion
    engine — verify these records.
  approved: null
  actuary_note: null
- name: seats
  description: Number of seats in the vehicle; proxy for vehicle category (passenger
    car vs. minibus) affecting occupant liability exposure.
  data_quality_note: null
  approved: null
  actuary_note: null
- name: liability_exposure
  description: Fractional exposure period for liability coverage; accounts for mid-term
    policy changes and partial-year exposure.
  data_quality_note: Min of 0.0027 is very small — verify these are not data errors
    representing near-zero exposure policies.
  approved: null
  actuary_note: null
